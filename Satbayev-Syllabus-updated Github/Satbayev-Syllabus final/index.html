<script id="language-data" type="application/json">{"packs": {"kk": {"sections": [{"title": "1. Оқытушы туралы ақпарат", "text": "Оқу түрі: күндізгі"}, {"title": "2. Пререквизиттер мен постреквизиттер", "text": ""}, {"title": "3. Курстың мақсаты мен міндеттері:", "text": "Мақсаты: Күрделі жүйелердің параметрлері мен жұмыс істеу процестерін модельдеу әдістерін меңгеру. Бұл курс келесі мақсаттарға жетуге ықпал етеді:\nТұрақты даму мақсаты 4 «Сапалы білім беру» – цифрлық сауаттылықты, интерфейсті жобалау дағдыларын, сыни ойлауды және өз бетінше оқуды дамыту; \nТұрақты даму мақсаты 5 «Гендерлік теңдік» – әйелдердің құқықтары мен мүмкіндіктерін кеңейтуді ілгерілету үшін жоғары тиімді технологияларды, әсіресе ақпараттық-коммуникациялық технологияларды белсенді пайдалану;\nТұрақты даму мақсаты 8 «Лайықты жұмыс және экономикалық өсу» – еңбек нарығында сұранысқа ие ақпаратты өңдеу және басқаруға арналған компьютерлік жүйелердегі құзыреттіліктерді дамыту;\nТұрақты даму мақсаты 9 «Өнеркәсіп, инновация және инфрақұрылым» – цифрлық инновациялар мен адамға бағытталған технологиялардағы құзыреттіліктерді дамыту.\nМіндеті:\n- күрделі жүйелердің тұрақсыз параметрлерін модельдеу әдістерін зерттеу; \n- өндірістік және экономикалық нысандармен байланысты кездейсоқ процестерді модельдеу; \n- басқару процестерінің ағымдағы жағдайын талдау; \n- кәсіпорындардағы ақпараттық тиімділік моделін құру."}, {"title": "4. Курстың сипаттамасы:", "text": "Курс «{{code}} {{course}}» білім беру бағдарламасы бойынша білім алушыларға арналған «{{course}}» пәні {{program}} білім беру бағдарламасы бойынша білім алушыларға арналған және компьютерлік жүйелердің ұйымдастырылуы мен жұмыс істеу қағидаларын кешенді түрде қарастырады. \nПән аясында компьютер архитектурасының эволюциясы, фон Нейман және Гарвард архитектуралары, процессорлардың құрылымы, командалар жүйесі, регистрлер, конвейерлік өңдеу, жады иерархиясы, кэштеу технологиялары, енгізу-шығару жүйелері, шиналар архитектурасы, көпядролы және көппроцессорлы жүйелер, виртуализация технологиялары, жоғары өнімді есептеу жүйелері және бұлттық есептеу платформалары оқытылады. \nПрактикалық сабақтар барысында білім алушылар компьютерлік жүйелердің архитектуралық ерекшеліктерін талдайды, олардың өнімділігін бағалайды, аппараттық ресурстардың тиімділігін салыстырады және нақты инженерлік есептерді шешуге бағытталған тапсырмаларды орындайды. Сонымен қатар, пән ақпараттық қауіпсіздік жүйелерінің аппараттық негіздерін түсінуге, цифрлық технологияларды тиімді пайдалануға және заманауи есептеу платформаларын кәсіби деңгейде бағалауға мүмкіндік береді."}, {"title": "5. Оқу нәтижелері", "text": "Курсты аяқтағаннан кейін білім алушы:\nБілуі керек:\n- компьютерлік жүйелердің архитектуралық қағидаларын, негізгі компоненттерінің қызметін және олардың өзара әрекеттесу механизмдерін; \n- процессорлардың, жад иерархиясының, енгізу-шығару жүйелерінің, көпядролы және көппроцессорлы жүйелердің жұмыс істеу ерекшеліктерін; \n- компьютерлік жүйелердің өнімділігіне әсер ететін негізгі факторларды, архитектуралық шешімдерді бағалау әдістерін және қазіргі есептеу платформаларының құрылымын.\nІстей алуы керек:\n- компьютерлік жүйелердің архитектурасын талдау және олардың өнімділігін бағалау; \n- процессор, жад және енгізу-шығару құрылғыларының жұмысын салыстыру және тиімді архитектуралық шешімдерді негіздеу; \n- инженерлік есептерді шешуде компьютерлік жүйелердің аппараттық ресурстарын тиімді пайдалану және заманауи есептеу платформаларының мүмкіндіктерін кәсіби қызметте қолдану.\nДағдыларды меңгеру:\n- компьютерлік жүйелердің архитектурасын зерттеу, талдау және техникалық сипаттамаларын бағалау; \n- аппараттық платформалардың өнімділігі мен тиімділігін салыстыру және инженерлік қорытынды жасау; \n- кәсіби қызметте компьютерлік жүйелердің архитектуралық ерекшеліктерін ескере отырып ақпараттық технологияларды, цифрлық құралдарды және есептеу ресурстарын тиімді пайдалану."}, {"title": "6. Күнтізбелік-тақырыптық жоспары", "text": ""}, {"title": "7. Әдебиет", "text": ""}, {"title": "8. Құзыреттілік шеңбері", "text": ""}, {"title": "9. Қажетті жұмыстарды тапсыру кестесі", "text": ""}, {"title": "10. Бағалау рейтингі және қорытынды бағалар", "text": ""}, {"title": "11. Бағалау критерийлері", "text": "Тесттен басқа әр жұмыс 4 критерий бойынша бағаланады:\n- ұқыптылық пен дәлдік (А)– 30% (жұмыс қаншалықты ұқыпты және дәл есептелген);\n- шығармашылық және креативтілік (T) - 30% (жұмыс қалай және қандай үлгіде ұсынылған);\n- толықтығы мен жетілуі (З) - 40% (жұмыс қаншалықты терең, қисынды және құрылымдық түрде шешілді); \n- ерекшелік (О) – арнайы 1.0;0.5 немесе 0 коэффициенті қолданылады.\nЖалпы балл келесі формула бойынша есептеледі:\nБаға = (А + Т + З)×О"}, {"title": "12. Жұмысты кеш тапсыру саясаты", "text": "Студент дәрістер мен практикалық сабақтарға дайындалып келуі керек.  Барлық жұмыс түрлерін (практикалық және өзіндік) толық орындау және уақытында қорғау талап етіледі. Студент сабақтан кешікпеуі және қалмауы қажет, жауапты және ұқыпты болуы керек. Уақытылы тапсырылмаған жұмыс үшін максималды балды 10% төмендету көзделген. Егер Сіз белгілі себептермен аралық бақылауды өткізіп алуға мәжбүр болсаңыз, онда Сіз бұл туралы оқытушыға алдын ала ескертіп, ертерек тапсыру мүмкіндігін алсаңыз болады. Емтиханды себепсіз жіберіп алу Сіздің оны қайта тапсыру құқығыңыздан айырады. Егер сіз емтиханды дәлелді себептермен жіберіп алсаңыз, қайта тапсыруға арнайы рұқсат беріліп, емтиханның күні, уақыты мен орны белгіленеді. "}, {"title": "13. Академиялық тәртіп және этика саясаты", "text": "Басқа адамдардың пікірін құрметтеңіз, төзімді болыңыз. Қарсы пікіріңізді дұрыс қалыпта білдіріңіз. Плагиатқа және адал емес жұмыстың басқа түрлеріне жол берілмейді. Басқа студенттер үшін емтихан тапсыруға, өзгеден көшіруге, айла қолдануға жол берілмейді. Курстың кез-келген ақпаратын бұрмалған студент «F» қорытынды бағасын алады.\nДәріс және практикалық сабақтардағы белсенділік сіздің қорытынды балл /бағаңызға  тікелей әсер етеді. Дәріс материалдарын күшейтетін көптеген теориялық сұрақтар тек дәрістерде ұсынылады. Сондықтан сабақты жіберіп алу сіздің үлгеріміңізге және сіздің соңғы бағаңызға әсер етуі мүмкін. Сабақ аяқталғанға дейін қандай да бір себептермен екі рет кету немесе кешігу бір жіберілген сабақ ретінде есептеледі. Алайда, тек сабаққа қатысу ұпайдың жоғарылауын білдірмейді. Сіздің сабақта үнемі белсенді болуыңыз қажет. Курстың міндетті талабы - әр сабаққа дайын болу. Оқулықтың көрсетілген бөлімдерін және қосымша материалдарды практикалық жаттығуларға дайындық кезінде ғана емес, сонымен бірге тиісті дәріске қатыспас бұрын да қарап шығу керек. Мұндай дайындық Сіздің жаңа материалды қабылдауыңызды жеңілдетеді және университет қабырғасында білімді белсенді түрде алуға ықпал етеді. \nКөмек: Өздік жұмыстарды орындау, оларды тапсыру және қорғау бойынша кеңестер, сондай-ақ өтілген материал туралы және оқылатын курс туралы барлық туындаған сұрақтар бойынша қосымша ақпарат алу үшін оқытушымен жұмыс уақытында немесе тәулік бойы электронды байланыс құралдары арқылы байланыса аласыз.\nОқу барысында  \nСабақ кестесіне сәйкес міндетті түрде сабаққа қатысу студенттің сабаққа дайындығын анықтайды. Сабаққа қатыспаған жағдайда студент оқытушыға тәулік ішінде хабарлауға және сабақты өздігінен үйрену жоспарын түсіндіруге міндетті.\n– оқу алдында ұсынылған материалдарды міндетті түрде оқып шығу;\n– тапсырмаларды уақытында тапсыру. Кеш тапсырғаны үшін -10% айыппұлдар қарастырылған;\n– 20%  сабаққа қатыспау (растайтын құжаттармен дәлелді себептерімен) - «F (Fail)» бағасына тең;\n– тапсырманы орындау кезінде плагиат пен алдауға жол берілмейді;\n– электронды гаджеттерді сабақта қолдану рұқсат етілгенімен, емтихан кезінде пайдалануға жол берілмейді;\nПән бойынша оқыту шеңберінде академиялық әділетсіздіктің, академиялық әдепсіздіктің және академиялық алдаудың және сыбайлас жемқорлықтың кез келген нысандағы кез келген көріністеріне жол берілмейді. Мұндай іс-әрекеттерді ұйымдастырушы (оқытушы, студенттер немесе үшінші тұлғ ралған.", "Толық емес, ой жүйелілігі әлсіз. (0.5)", "Жауап мазмұнсыз, құрылымсыз. (0.4)"], ["Ерекшелігі", "Толықтай авторлық, плагиат жоқ. (1.0)", "Негізінен авторлық, бірақ ұқсас элементтер бар. (0.8)", "Жұмыстың жартысы қайталанған. (0.5)", "Жұмыс плагиат, ерекшелігі жоқ. (0.0–0.4)"]]}}, "ru": {"sections": [{"title": "1. Информация о преподавателе", "text": "Форма обучения: очная"}, {"title": "2. Пререквизиты и постреквизиты", "text": ""}, {"title": "3. Цель и задачи курса", "text": "Цель: освоить методы моделирования параметров и процессов функционирования сложных систем. Курс способствует достижению следующих целей:\nЦель устойчивого развития 4 «Качественное образование» — развитие цифровой грамотности, навыков проектирования интерфейсов, критического мышления и самостоятельного обучения;\nЦель устойчивого развития 5 «Гендерное равенство» — активное применение высокоэффективных технологий, прежде всего информационно-коммуникационных, для расширения прав и возможностей женщин;\nЦель устойчивого развития 8 «Достойная работа и экономический рост» — развитие востребованных на рынке труда компетенций обработки информации и управления компьютерными системами;\nЦель устойчивого развития 9 «Индустриализация, инновации и инфраструктура» — развитие компетенций в области цифровых инноваций и человекоориентированных технологий.\nЗадачи:\n- изучить методы моделирования неустойчивых параметров сложных систем;\n- моделировать случайные процессы, связанные с производственными и экономическими объектами;\n- анализировать текущее состояние процессов управления;\n- создавать модели информационной эффективности предприятий."}, {"title": "4. Описание курса", "text": "Дисциплина «{{code}} {{course}}» предназначена для обучающихся образовательной программы {{program}} и комплексно рассматривает организацию компьютерных систем и принципы их функционирования.\nИзучаются эволюция архитектуры компьютеров, архитектуры фон Неймана и Гарварда, структура процессоров, системы команд, регистры, конвейерная обработка, иерархия памяти, кэширование, системы ввода-вывода, архитектура шин, многоядерные и многопроцессорные системы, виртуализация, высокопроизводительные вычисления и облачные платформы.\nНа практических занятиях обучающиеся анализируют архитектурные особенности компьютерных систем, оценивают производительность, сравнивают эффективность аппаратных ресурсов и выполняют задания для решения инженерных задач. Дисциплина помогает понять аппаратные основы информационной безопасности, эффективно использовать цифровые технологии и профессионально оценивать современные вычислительные платформы."}, {"title": "5. Результаты обучения", "text": "После завершения курса обучающийся должен:\nЗнать:\n- архитектурные принципы компьютерных систем, функции основных компонентов и механизмы их взаимодействия;\n- особенности работы процессоров, иерархии памяти, систем ввода-вывода, многоядерных и многопроцессорных систем;\n- факторы производительности, методы оценки архитектурных решений и устройство современных вычислительных платформ.\nУметь:\n- анализировать архитектуру компьютерных систем и оценивать их производительность;\n- сравнивать работу процессора, памяти и устройств ввода-вывода, обосновывать эффективные архитектурные решения;\n- эффективно использовать аппаратные ресурсы для инженерных задач и применять возможности современных вычислительных платформ в профессиональной деятельности.\nВладеть навыками:\n- исследования архитектуры компьютерных систем и оценки технических характеристик;\n- сравнения производительности и эффективности аппаратных платформ, подготовки инженерных выводов;\n- эффективного использования информационных технологий, цифровых инструментов и вычислительных ресурсов с учётом архитектурных особенностей систем."}, {"title": "6. Календарно-тематический план", "text": ""}, {"title": "7. Литература", "text": ""}, {"title": "8. Рамка компетенций", "text": ""}, {"title": "9. График сдачи требуемых работ", "text": ""}, {"title": "10. Рейтинг и итоговые оценки", "text": ""}, {"title": "11. Критерии оценивания", "text": "Каждая работа, кроме тестов, оценивается по четырём критериям:\n- аккуратность и точность (А) — 30% (качество оформления и точность вычислений);\n- творчество и креативность (Т) — 30% (форма и способ представления работы);\n- полнота и проработанность (З) — 40% (глубина, логичность и структура решения);\n- оригинальность (О) — применяется коэффициент 1,0; 0,5 или 0.\nОбщий балл рассчитывается по формуле:\nОценка = (А + Т + З) × О"}, {"title": "12. Политика поздней сдачи работ", "text": "Студент должен приходить подготовленным на лекционные и практические занятия. Все практические и самостоятельные работы необходимо выполнить полностью и защитить вовремя. Требуются ответственность, аккуратность, отсутствие опозданий и пропусков. За несвоевременную сдачу максимальный балл снижается на 10%. Если по уважительной причине невозможно пройти промежуточный контроль, следует заранее предупредить преподавателя и согласовать досрочную сдачу. Пропуск экзамена без уважительной причины лишает права на пересдачу. При подтверждённой уважительной причине предоставляется специальное разрешение и назначаются дата, время и место экзамена."}, {"title": "13. Академическая дисциплина и этика", "text": "Уважайте мнение других людей и проявляйте терпимость. Выражайте несогласие корректно. Плагиат и другие формы недобросовестной работы запрещены. Нельзя сдавать экзамен за другого студента, списывать или использовать обман. За искажение информации по курсу выставляется итоговая оценка F.\nАктивность на лекциях и практических занятиях непосредственно влияет на итоговый балл. Многие теоретические вопросы раскрываются только на лекциях, поэтому пропуски могут повлиять на успеваемость. Два опоздания или ухода до окончания занятия учитываются как один пропуск. Само присутствие не увеличивает балл: требуется регулярное активное участие. Подготовка к каждому занятию обязательна. Разделы учебников и дополнительные материалы следует изучать как перед практическими занятиями, так и до соответствующей лекции. Это облегчает усвоение нового материала и способствует активному обучению.\nПомощь: консультации по самостоятельным работам, их сдаче и защите, а также по материалам курса можно получить в часы работы преподавателя или через электронные средства связи.\nВ процессе обучения:\nПосещение занятий по расписанию обязательно. При пропуске студент должен сообщить преподавателю в течение суток и объяснить план самостоятельного изучения материала.\n– обязательно изучать рекомендованные материалы до занятия;\n– сдавать задания вовремя; за опоздание предусмотрено снижение на 10%;\n– пропуск 20% занятий, в том числе по документально подтверждённым уважительным причинам, приравнивается к F (Fail);\n– не допускать плагиата и обмана;\n– электронные устройства разрешены на занятиях, но запрещены на экзамене.\nЛюбые проявления академической недобросовестности, неэтичного поведения, обмана и коррупции запрещены. Организаторы таких действий — преподаватели, студенты или третьи лица, действующие по их поручению, — несут ответственность по законодательству Республики Казахстан и правилам университета.\nВ начале семестра обучающиеся должны ознакомиться с силлабусом: Ф КазНИТУ 401-03. Журнал ознакомления."}], "tables": {"1": [["Пререквизиты", "CSE536 Компьютерная графика"], ["Постреквизиты", "SEC I 75 Безопасность Интернета вещей"]], "5": [["Неделя", "Тема лекции", "Тема практической работы", "СРС, СРСП", "Литература", "Срок сдачи"], ["1", "Введение в архитектуру компьютерных систем", "Определение компонентов компьютера и анализ конфигурации ПК", "", "[1] Глава 1, [2] Глава 1", ""], ["2", "Архитектура процессора: CPU, ядра, потоки и тактовая частота", "Анализ характеристик и архитектуры процессора", "", "[1] Глава 6, [2] Глава 1", "ПР №1."], ["3", "Регистры и внутренняя структура процессора. АЛУ и устройство управления", "Исследование выполнения процессорных инструкций", "", "[2] Глава 3, [3] Глава 5", "\n"], ies.\nObjectives:\n- study methods for modelling unstable parameters of complex systems;\n- model random processes associated with production and economic facilities;\n- analyse the current state of management processes;\n- develop models of organisational information efficiency."}, {"title": "4. Course description", "text": "The course “{{code}} {{course}}” is intended for students of the {{program}} degree programme and provides a comprehensive study of computer-system organisation and operating principles.\nTopics include the evolution of computer architecture; von Neumann and Harvard architectures; processor structure; instruction sets; registers; pipelining; memory hierarchy; caching; input/output systems; bus architecture; multicore and multiprocessor systems; virtualisation; high-performance computing; and cloud platforms.\nIn practical sessions, students analyse architectural features, assess performance, compare the efficiency of hardware resources and complete engineering-oriented tasks. The course also develops an understanding of the hardware foundations of information security, effective use of digital technologies and professional evaluation of modern computing platforms."}, {"title": "5. Learning outcomes", "text": "On completion of the course, students should:\nKnow:\n- architectural principles of computer systems, functions of their main components and mechanisms of interaction;\n- operating features of processors, memory hierarchies, input/output systems, multicore and multiprocessor systems;\n- factors affecting performance, methods for evaluating architectural decisions and the structure of modern computing platforms.\nBe able to:\n- analyse computer-system architecture and assess performance;\n- compare processors, memory and input/output devices and justify effective architectural decisions;\n- use hardware resources efficiently for engineering tasks and apply modern computing platforms in professional practice.\nDevelop skills in:\n- investigating computer-system architecture and evaluating technical specifications;\n- comparing the performance and efficiency of hardware platforms and drawing engineering conclusions;\n- using information technologies, digital tools and computing resources efficiently while accounting for architectural features."}, {"title": "6. Weekly teaching schedule", "text": ""}, {"title": "7. References", "text": ""}, {"title": "8. Competency framework", "text": ""}, {"title": "9. Assessment submission schedule", "text": ""}, {"title": "10. Grading scale and final grades", "text": ""}, {"title": "11. Assessment criteria", "text": "Each assignment, except tests, is assessed using four criteria:\n- neatness and accuracy (A): 30% (presentation quality and accuracy of calculations);\n- creativity (T): 30% (the form and manner of presentation);\n- completeness and development (Z): 40% (depth, logic and structure of the solution);\n- originality (O): a multiplier of 1.0, 0.5 or 0 is applied.\nThe total score is calculated as follows:\nGrade = (A + T + Z) × O"}, {"title": "12. Late submission policy", "text": "Students must prepare for lectures and practical classes. All practical and independent assignments must be completed in full and defended on time. Students are expected to be responsible and punctual and avoid absences. The maximum score for late work is reduced by 10%. Students who cannot attend an interim assessment for a valid reason should notify the instructor in advance and arrange early submission. Missing an examination without a valid reason removes the right to a resit. A documented valid reason permits a specially authorised examination at an agreed date, time and location."}, {"title": "13. Academic conduct and ethics", "text": "Respect other people's opinions and show tolerance. Express disagreement appropriately. Plagiarism and other forms of academic misconduct are prohibited. Taking an examination for another student, copying or cheating is not allowed. Falsification of course information results in a final grade of F.\nParticipation in lectures and practical sessions directly affects the final score. Many theoretical questions are discussed only in lectures, so absences may affect achievement. Two late arrivals or early departures count as one absence. Attendance alone does not increase the score: consistent active participation is required. Preparation for every class is compulsory. Students should read the specified textbook sections and supplementary materials before both practical sessions and the corresponding lectures. This supports understanding and active learning.\nSupport: guidance on independent assignments, submission, defence and course content is available during the instructor's office hours or through electronic communication.\nDuring the course:\nAttendance according to the timetable is compulsory. If absent, the student must inform the instructor within 24 hours and explain a plan for independent study.\n– read the recommended materials before class;\n– submit work on time; late submission incurs a 10% reduction;\n– missing 20% of classes, including documented absences for valid reasons, is equivalent to F (Fail);\n– do not plagiarise or cheat;\n– electronic devices are permitted in class but prohibited during examinations.\nAll forms of academic dishonesty, unethical conduct, deception and corruption are prohibited. Organisers of such conduct, whether instructors, students or third parties acting on their behalf, are responsible under the laws of the Republic of Kazakhstan and university regulations.\nAt the beginning of the semester, students must read the syllabus and sign the acknowledgement register: KazNRTU Form 401-03."}], "tables": {"1": [["Prerequisites", "CSE536 Computer Graphics"], ["Postrequisites", "SEC I 75 Internet of Things Security"]], "5": [["Week", "Lecture topic", "Practical work", "Independent study", "Reading", "Due date"], ["1", "Introduction to computer-system architecture", "Identify "protocolNumber": ""}, "sections": [{"title": "1. Оқытушы туралы ақпарат", "text": "Оқу түрі: күндізгі"}, {"title": "2. Пререквизиттер мен постреквизиттер", "text": ""}, {"title": "3. Курстың мақсаты мен міндеттері:", "text": "Мақсаты: Күрделі жүйелердің параметрлері мен жұмыс істеу процестерін модельдеу әдістерін меңгеру. Бұл курс келесі мақсаттарға жетуге ықпал етеді:\nТұрақты даму мақсаты 4 «Сапалы білім беру» – цифрлық сауаттылықты, интерфейсті жобалау дағдыларын, сыни ойлауды және өз бетінше оқуды дамыту; \nТұрақты даму мақсаты 5 «Гендерлік теңдік» – әйелдердің құқықтары мен мүмкіндіктерін кеңейтуді ілгерілету үшін жоғары тиімді технологияларды, әсіресе ақпараттық-коммуникациялық технологияларды белсенді пайдалану;\nТұрақты даму мақсаты 8 «Лайықты жұмыс және экономикалық өсу» – еңбек нарығында сұранысқа ие ақпаратты өңдеу және басқаруға арналған компьютерлік жүйелердегі құзыреттіліктерді дамыту;\nТұрақты даму мақсаты 9 «Өнеркәсіп, инновация және инфрақұрылым» – цифрлық инновациялар мен адамға бағытталған технологиялардағы құзыреттіліктерді дамыту.\nМіндеті:\n- күрделі жүйелердің тұрақсыз параметрлерін модельдеу әдістерін зерттеу; \n- өндірістік және экономикалық нысандармен байланысты кездейсоқ процестерді модельдеу; \n- басқару процестерінің ағымдағы жағдайын талдау; \n- кәсіпорындардағы ақпараттық тиімділік моделін құру."}, {"title": "4. Курстың сипаттамасы:", "text": "Курс «{{code}} {{course}}» білім беру бағдарламасы бойынша білім алушыларға арналған «{{course}}» пәні {{program}} білім беру бағдарламасы бойынша білім алушыларға арналған және компьютерлік жүйелердің ұйымдастырылуы мен жұмыс істеу қағидаларын кешенді түрде қарастырады. \nПән аясында компьютер архитектурасының эволюциясы, фон Нейман және Гарвард архитектуралары, процессорлардың құрылымы, командалар жүйесі, регистрлер, конвейерлік өңдеу, жады иерархиясы, кэштеу технологиялары, енгізу-шығару жүйелері, шиналар архитектурасы, көпядролы және көппроцессорлы жүйелер, виртуализация технологиялары, жоғары өнімді есептеу жүйелері және бұлттық есептеу платформалары оқытылады. \nПрактикалық сабақтар барысында білім алушылар компьютерлік жүйелердің архитектуралық ерекшеліктерін талдайды, олардың өнімділігін бағалайды, аппараттық ресурстардың тиімділігін салыстырады және нақты инженерлік есептерді шешуге бағытталған тапсырмаларды орындайды. Сонымен қатар, пән ақпараттық қауіпсіздік жүйелерінің аппараттық негіздерін түсінуге, цифрлық технологияларды тиімді пайдалануға және заманауи есептеу платформаларын кәсіби деңгейде бағалауға мүмкіндік береді."}, {"title": "5. Оқу нәтижелері", "text": "Курсты аяқтағаннан кейін білім алушы:\nБілуі керек:\n- компьютерлік жүйелердің архитектуралық қағидаларын, негізгі компоненттерінің қызметін және олардың өзара әрекеттесу механизмдерін; \n- процессорлардың, жад иерархиясының, енгізу-шығару жүйелерінің, көпядролы және көппроцессорлы жүйелердің жұмыс істеу ерекшеліктерін; \n- компьютерлік жүйелердің өнімділігіне әсер ететін негізгі факторларды, архитектуралық шешімдерді бағалау әдістерін және қазіргі есептеу платформаларының құрылымын.\nІстей алуы керек:\n- компьютерлік жүйелердің архитектурасын талдау және олардың өнімділігін бағалау; \n- процессор, жад және енгізу-шығару құрылғыларының жұмысын салыстыру және тиімді архитектуралық шешімдерді негіздеу; \n- инженерлік есептерді шешуде компьютерлік жүйелердің аппараттық ресурстарын тиімді пайдалану және заманауи есептеу платформаларының мүмкіндіктерін кәсіби қызметте қолдану.\nДағдыларды меңгеру:\n- компьютерлік жүйелердің архитектурасын зерттеу, талдау және техникалық сипаттамаларын бағалау; \n- аппараттық платформалардың өнімділігі мен тиімділігін салыстыру және инженерлік қорытынды жасау; \n- кәсіби қызметте компьютерлік жүйелердің архитектуралық ерекшеліктерін ескере отырып ақпараттық технологияларды, цифрлық құралдарды және есептеу ресурстарын тиімді пайдалану."}, {"title": "6. Күнтізбелік-тақырыптық жоспары", "text": ""}, {"title": "7. Әдебиет", "text": ""}, {"title": "8. Құзыреттілік шеңбері", "text": ""}, {"title": "9. Қажетті жұмыстарды тапсыру кестесі", "text": ""}, {"title": "10. Бағалау рейтингі және қорытынды бағалар", "text": ""}, {"title": "11. Бағалау критерийлері", "text": "Тесттен басқа әр жұмыс 4 критерий бойынша бағаланады:\n- ұқыптылық пен дәлдік (А)– 30% (жұмыс қаншалықты ұқыпты және дәл есептелген);\n- шығармашылық және креативтілік (T) - 30% (жұмыс қалай және қандай үлгіде ұсынылған);\n- толықтығы мен жетілуі (З) - 40% (жұмыс қаншалықты терең, қисынды және құрылымдық түрде шешілді); \n- ерекшелік (О) – арнайы 1.0;0.5 немесе 0 коэффициенті қолданылады.\nЖалпы балл келесі формула бойынша есептеледі:\nБаға = (А + Т + З)×О"}, {"title": "12. Жұмысты кеш тапсыру саясаты", "text": "Студент дәрістер мен практикалық сабақтарға дайындалып келуі керек.  Барлық жұмыс түрлерін (практикалық және өзіндік) толық орындау және уақытында қорғау талап етіледі. Студент сабақтан кешікпеуі және қалмауы қажет, жауапты және ұқыпты болуы керек. Уақытылы тапсырылмаған жұмыс үшін максималды балды 10% төмендету көзделген. Егер Сіз белгілі себептермен аралық бақылауды өткізіп алуға мәжбүр болсаңыз, онда Сіз бұл туралы оқытушыға алдын ала ескертіп, ертерек тапсыру мүмкіндігін алсаңыз болады. Емтиханды себепсіз жіберіп алу Сіздің оны қайта тапсыру құқығыңыздан айырады. Егер сіз емтиханды дәлелді себептермен жіберіп алсаңыз, қайта тапсыруға арнайы рұқсат беріліп, емтиханның күні, уақыты мен орны белгіленеді. "}, {"title": "13. Академиялық тәртіп және этика саясаты", "text": "Басқа адамдардың пікірін құрметтеңіз, төзімді болыңыз. Қарсы пікіріңізді дұрыс қалыпта білдіріңіз. Плагиатқа және адал емес жұмыстың басқа түрлеріне жол берілмейді. Басқа студенттер үшін емтихан тапсыруға, өзгеден көшіруге, айла қолдануға жол берілмейді. Курстың кез-келген ақпаратын бұрмалған студент «F» қорытынды бағасын алады.\nДәріс және практикалық сабақтардағы белсенділік сіздің қорытынды балл /бағаңызға  тікелей әсер етеді. Дәріс материалдарын күшейтетін көптеген теориялық сұрақтар тек дәрістерде ұсынылады. Сондықтан сабақты жіберіп алу сіздің үлгеріміңізге және сіздің соңғы бағаңызға әсер етуі мүмкін. Сабақ аяқталғанға дейін қандай да бір себептермен екі рет кету немесе кешігу бір жіберілген сабақ ретінде есептеледі. Алайда, тек сабаққа қатысу ұпайдың жоғарылауын білдірмейді. Сіздің сабақта үнемі белсенді болуыңыз қажет. Курстың міндетті талабы - әр сабаққа дайын болу. Оқулықтың көрсетілген бөлімдерін және қосымша материалдарды практикалық жаттығуларға дайындық кезінде ғана емес, сонымен бірге тиісті дәріске қатыспас бұрын да қарап шығу керек. Мұндай дайындық Сіздің жаңа материалды қабылдауыңызды жеңілдетеді және университет қабырғасында білімді белсенді түрде алуға ықпал етеді. \nКөмек: Өздік жұмыстарды орындау, оларды тапсыру және қорғау бойынша кеңестер, сондай-ақ өтілген материал туралы және оқылатын курс туралы барлық туындаған сұрақтар бойынша қосымша ақпарат алу үшін оқытушымен жұмыс уақытында немесе тәулік бойы электронды байланыс құралдары арқылы байланыса аласыз.\nОқу барысында  \nСабақ кестесіне сәйкес міндетті түрде сабаққа қатысу студенттің сабаққа дайындығын анықтайды. Сабаққа қатыспаған жағдайда студент оқытушыға тәулік ішінде хабарлауға және сабақты өздігінен үйрену жоспарын түсіндіруге міндетті.\n– оқу алдында ұсынылған материалдарды міндетті түрде оқып шығу;\n– тапсырмаларды уақытында тапсыру. Кеш тапсырғаны үшін -10% айыппұлдар қарастырылған;\n– 20%  сабаққа қатыспау (растайтын құжаттармен дәлелді себептерімен) - «F (Fail)» бағасына тең;\n– тапсырманы орындау кезінде плагиат пен алдауға жол берілмейді;\n– электронды гаджеттерді сабақта қолдану рұқсат етілгенімен, емтихан кезінде пайдалануға жол берілмейді;\nПән бойынша оқыту шеңберінде академиялық әділетсіздіктің, академиялық әдепсіздіктің және академиялық алдаудың және сыбайлас жемқорлықтың кез келген нысандағы кез келген көріністеріне жол берілмейді. Мұндай іс-әрекеттерді ұйымдастырушы (оқытушы, студенттер немесе үшінші тұлғалар олардың тапсырмасы бойынша) Қазақстан Республикасының заңдары мен университет ережелерін бұзғаны үшін толық жауапты болады.\nАкадемиялық семестрдің басында білім алушылар силлабустың мазмұнымен танысуы қажет ҚазҰТЗУ 401-03 Ү. Таныстыру журналы.docx."}], "tables": {"1": [["Пререквизиттер", "CSE536 Компьютерлік графика"], ["Постреквизиттер", "SEC I 75 Интернет заттар қауіпсіздігі"]], "5": [["Апта", "Дәріс тақырыбы", "Практикалық жұмыстар тақырыбы", "СӨЖ, СОӨЖ", "Әдебиетке сілтеме", "Тапсыру уақыты"], ["1", "Компьютерлік жүйелер архитектурасына кіріспе. ", "Компьютер компоненттерін анықтау және ДК конфигурациясын талдау", "", "[1] Тарау 1, [2] Тарау 1", ""], ["2", "Процессор архитектурасы: CPU, ядролар, ағындар және тактілік жиілік", "Процессордың сипаттамалары мен архитектурасын талдау", "", "[1] Тарау 6, [2] Тарау 1", "ПЖ №1."], ["3", "Процессор регистрлері және ішкі құрылымы. ALU және басқару құрылғысы", "Процессордың нұсқауларды орындау деңгейіндегі жұмысын зерттеу", "", "[2] Тарау 3, [3] Тарау 5", "\n"], ["4", "Машиналық нұсқаулар және команданы орындау циклі", "Fetch → Decode → Execute циклін модельдеу", "", "[1] Тарау 8, [2] Тарау 3, 4, [3] Тарау 2, 5", "ПЖ №2"], ["5", "Процессор архитектуралары: x86, x64 және ARM", "Intel/AMD және ARM процессорларына салыстырмалы талдау жасау", "СӨЖ №1 MIPS ассемблерінде шартты операторларды пайдаланып, көп деңгейлі тармақталуды жүзеге асыру\n", "[2] Тарау 8, [3] Тарау 5", ""], ["6", "Жедел жад. RAM, ROM, жад құрылымы және ұйымдастырылуы", "Windows/Linux жүйелерінде жедел жадты пайдалануды талдау", "", "[1] Тарау 6, [3] Қосымша A", "ПЖ №3"], ["7", "Кэш-жад: L1, L2, L3 және деректер локальдылығы", "Кэш-жадтың өнімділікке әсерін зерттеу", "", "[1] Тарау 6, [2] Тарау 4", "СӨЖ 1"], ["8", "Ассемблер тіліндегі бағдарламалау негіздері және басқару құрылымдары.", "Компьютер архитектурасын талдау бойынша практикалық тапсырма/тест", "", "[1] Тарау 6, [3] Қосымша A", "ПЖ №4"], ["8", "Бірінші аралық аттестация", "Бірінші аралық аттестация", "Бірінші аралық аттестация", "Бірінші а const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let interfaceLanguage='kk';try{const saved=localStorage.getItem('syllabus-interface-language');if(['kk','ru','en'].includes(saved))interfaceLanguage=saved}catch{}
let renderingDocument=false;const T=k=>ui[renderingDocument?S.lang:interfaceLanguage][k]||ui.kk[k]||k;
function valid(v){return v&&v.version===1&&['kk','ru','en'].includes(v.lang)&&Number.isInteger(v.active)&&v.active>=0&&v.active<=15&&v.meta&&Object.values(v.meta).every(x=>typeof x==='string')&&INITIAL_KEYS.every(k=>typeof v.meta[k]==='string')&&Array.isArray(v.sections)&&v.sections.length===13&&v.sections.every(x=>x&&typeof x.title==='string'&&typeof x.text==='string')&&v.tables&&[1,5,6,7,8,9,10].every(k=>Array.isArray(v.tables[k])&&v.tables[k].length>0&&v.tables[k].length<500&&v.tables[k].every(r=>Array.isArray(r)&&r.length>0&&r.length<=30&&r.every(x=>typeof x==='string')))&&Array.isArray(v.catalog)&&v.catalog.length>0&&v.catalog.length<=100&&v.catalog.every(x=>x&&typeof x.name==='string'&&['departments','programs'].every(k=>Array.isArray(x[k])&&x[k].length<1000&&x[k].every(a=>typeof a==='string')))&&v.format&&['font','line','top','bottom','left','right'].every(k=>Number.isFinite(+v.format[k]))&&v.format.font>=9&&v.format.font<=16&&v.format.line>=1&&v.format.line<=2&&['top','bottom','left','right'].every(k=>v.format[k]>=5&&v.format[k]<=40)}
function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));storageAvailable=true}catch(e){storageAvailable=false}$('status').textContent=storageAvailable?T('status'):T('localOnly')},300)}
function changed(){persist();clearTimeout(timer);timer=setTimeout(renderDocument,220)}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3500)}
function nav(){const names=[T('cover'),...ui[interfaceLanguage].sections,T('catalog'),T('settings')];$('nav').innerHTML=names.map((x,i)=>`<button class="nav ${S.active===i?'active':''} ${i===14?'special':''}" data-section="${i}" ${i===S.active?'aria-current="step"':''}><i>${i<14?String(i).padStart(2,'0'):i===14?'◈':'⚙'}</i><span>${esc(x)}</span></button>`).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.active=+b.dataset.section;renderEditor();nav();persist();$('editor').scrollTop=0});}
function field(k,list){const values=choices(k);if(values.length)list=values.map(x=>x.value);return `<div class="field"><label for="f-${k}">${esc(T(k))}</label><div class="${list?'pickerfield':''}"><input id="f-${k}" data-meta="${k}" value="${esc(S.meta[k])}">${list?`<button type="button" aria-label="${esc(T(k))}: ${esc(T('openList'))}" onclick="openPicker('${k}')">▾ ${esc(T('openList'))}</button>`:''}</div>${list?`<div class="selection-note">${list.length} ${esc(T('optionsCount'))} · ${esc(T('custom'))}</div>`:''}</div>`}

function bindMeta(){document.querySelectorAll('[data-meta]').forEach(el=>el.oninput=()=>{S.meta[el.dataset.meta]=el.value;changed();if(el.dataset.meta==='course'){const c=(S.courses||[]).find(x=>x.title===el.value);if(c){S.meta.code=c.code;const f=$('f-code');if(f)f.value=c.code}}if(el.dataset.meta==='institute'){let d=S.catalog.find(x=>x.name===el.value);['department','program'].forEach((k,i)=>{let dl=$('list-'+k);if(dl)dl.innerHTML=(d?(i?d.programs:d.departments):S.catalog.flatMap(x=>i?x.programs:x.departments)).map(v=>`<option value="${esc(v)}"></option>`).join('')})}})}
function renderEditor(){let a=S.active;let title=a===0?T('title'):a===14?T('catalog'):a===15?T('settings'):ui[interfaceLanguage].sections[a-1];let h=`<div class="step"><span>SYLLABUS STUDIO</span><span class="step-controls">${String(a).padStart(2,'0')} / 15<button class="editor-toggle" onclick="togglePreview()" aria-controls="editor" aria-label="${esc(T('hideEditor'))}" title="${esc(T('hideEditor'))}">←</button></span></div><h1>${esc(title)}</h1><p class="intro">${esc(T('intro'))}</p>`;
if(a===0){let d=S.catalog.find(x=>x.name===S.meta.institute);h+=field('university')+field('institute',S.catalog.map(x=>x.name))+field('department',d?d.departments:S.catalog.flatMap(x=>x.departments))+field('program',S.catalog.flatMap(x=>x.programs));h+=`<div class="note warning">${esc(T('catalogNote'))}</div>`;h+='<div class="subhead">01 · '+esc(T('course'))+'</div>'+field('course')+'<div class="grid2">'+['code','cycle','credits','distribution','studyYear','semester','year','date','city','director'].map(k=>field(k)).join('')+'</div>';h+=`<div class="note">${esc(T('notice'))}</div>`}
else if(a<14){let n=a-1;h+=`<div class="field"><label for="sectitle">${esc(T('sectionTitle'))}</label><input id="sectitle" value="${esc(S.sections[n].title)}"></div>`;
if(a===1){h+=['lecturer','practice'].map(k=>field(k)).join('')+'<div class="grid2">'+['office','officeHours','email','phone'].map(k=>field(k)).join('')+'</div>'}
h+=`<div class="field"><label for="sectext">${esc(T('content'))}</label><textarea id="sectext" style="min-height:${a===1?90:260}px">${esc(S.sections[n].text)}</textarea></div>`;
if(S.tables[n])h+=`<div class="subhead">${esc(T('table'))} <span class="count">· ${S.tables[n].length-1} ${esc(T('row'))}</span></div><div class="tableedit" id="tableedit">${editorTable(n)}</div><div class="rowactions"><button onclick="addRow(${n})">＋ ${esc(T('add'))}</button></div>`;
if(a===9)h+=`<div class="note warning">${esc(T('issues'))}</div>`;
if(a===13)h+='<div class="subhead">'+esc(T('agreement'))+'</div>'+['head','author','protocol'].map(k=>field(k)).join('')+`<div class="field"><label for="agreement">${esc(T('agreement'))}</label><textarea id="agreement">${esc(S.meta.agreement)}</textarea></div>`;
}
else if(a===14){h+=`<div class="note warning">${esc(T('catalogNote'))}</div><div class="count">${S.catalog.length} институт / мектеп · ${S.catalog.reduce((n,x)=>n+x.departments.length,0)} кафедра / бағыт · ${S.catalog.reduce((n,x)=>n+x.programs.length,0)} бағдарлама / атау</div>`;S.catalog.forEach((c,i)=>{h+=`<details ${i===0?'open':''}><summary>${esc(c.name)}</summary><div class="field"><label for="cat-${i}-name">${esc(T('catalogName'))}</label><input id="cat-${i}-name" data-cat="${i}" data-key="name" value="${esc(c.name)}"></div><div class="field"><label for="cat-${i}-departments">${esc(T('departments'))}</label><textarea id="cat-${i}-departments" data-cat="${i}" data-key="departments">${esc(c.departments.join('\n'))}</textarea></div><div class="field"><label for="cat-${i}-programs">${esc(T('programs'))}</label><textarea id="cat-${i}-programs" data-cat="${i}" data-key="programs">${esc(c.programs.join('\n'))}</textarea></div>${S.catalog.length>1?`<button onclick="deleteInstitute(${i})">${esc(T('delete'))}</button>`:''}</details>`});h+=`<button onclick="addInstitute()">＋ ${esc(T('addInstitute'))}</button><div class="subhead">${esc(T('programDirectory'))}</div><div class="field"><textarea id="programDirectory" style="min-height:220px">${esc(S.programDirectory.map(x=>x.title).join('\n'))}</textarea></div><div class="subhead">${esc(T('courseDirectory'))}</div><div class="note">${esc(T('courseNotice'))}</div><div class="field course-directory"><textarea id="courseDirectory">${esc(S.courses.map(x=>x.code+' | '+x.title).join('\n'))}</textarea></div><div class="subhead">${esc(T('universityDirectory'))}</div><div class="field"><textarea id="universityDirectory">${esc(S.universities.join('\n'))}</textarea></div>`+sources();}
else{h+=`<div class="note">${esc(T('formatNote'))}</div><div class="grid2">`+['font','line','top','bottom','left','right'].map(k=>`<div class="field"><label for="fmt-${k}">${esc(T(k))}</label><input id="fmt-${k}" type="number" data-format="${k}" value="${S.format[k]}" min="${k==='font'?9:k==='line'?1:5}" max="${k==='font'?16:k==='line'?2:40}" step="${k==='line'?0.05:0.5}"></div>`).join('')+`</div><div class="note">${esc(T('printNote'))}</div><div class="subhead">${esc(T('checkTitle'))}</div><div id="checks"></div><div class="subhead">${esc(T('instructions'))}</div><div class="note" style="white-space:pre-line">${esc(T('help'))}</div><div class="rowactions"><button onclick="exportJSON()">${esc(T('backup'))}</button><button onclick="$('importer').click()">${esc(T('import'))}</button><button onclick="resetProject()">${esc(T('restore'))}</button></div>`+`<button class="project-download" onclick="downloadProject()">${esc(T('projectZip'))}</button>`+sources()}
$('editor').innerHTML=h;bindMeta();if(a>0&&a<14){$('sectitle').oninput=e=>{S.sections[a-1].title=e.target.value;changed()};$('sectext').oninput=e=>{S.sections[a-1].text=e.target.value;changed()};bindTable(a-1);if($('agreement'))$('agreement').oninput=e=>{S.meta.agreement=e.target.value;changed()}}
document.querySelectorAll('[data-cat]').forEach(el=>el.oninput=()=>{let c=S.catalog[+el.dataset.cat],k=el.dataset.key;c[k]=k==='name'?el.value:el.value.split('\n').filter(x=>x.trim());changed()});document.querySelectorAll('[data-format]').forEach(el=>el.oninput=()=>{if(el.checkValidity()&&el.value!==''){S.format[el.dataset.format]=+el.value;changed()}});if(a===15)checks();bindDirectories();}
function editorTable(n){return `<table><tbody>${S.tables[n].map((r,i)=>'<tr>'+r.map((c,j)=>`<td><textarea aria-label="${esc(T('table'))}: ${i+1}, ${j+1}" data-t="${n}" data-r="${i}" data-c="${j}">${esc(c)}</textarea></td>`).join('')+(i>0?`<td><button title="${esc(T('remove'))}" aria-label="${esc(T('remove'))} ${i}" onclick="removeRow(${n},${i})">×</button></td>`:'<td></td>')+'</tr>').join('')}</tbody></table>`}
function bindTable(n){document.querySelectorAll('[data-t]').forEach(el=>el.oninput=()=>{S.tables[+el.dataset.t][+el.dataset.r][+el.dataset.c]=el.value;changed()})}
function addRow(n){S.tables[n].push(Array(S.tables[n][0].length).fill(''));renderEditor();changed()}
function removeRow(n,i){S.tables[n].splice(i,1);renderEditor();changed()}

 if(k==='department'){const selected=S.catalog.find(x=>x.name===S.meta.institute);return uniqueOptions([...(selected?[...selected.departments.map(value=>({value,group:selected.name}))]:[]),...S.catalog.flatMap(x=>x.departments.map(value=>({value,group:x.name})))])}
