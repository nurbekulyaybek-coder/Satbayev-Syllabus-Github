<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Satbayev · Syllabus Studio</title><style>__CSS__</style></head><body>
<div id="loginScreen"><div class="login-card"><div class="monogram">S</div><div class="eyebrow">SATBAYEV UNIVERSITY</div><h1>Syllabus Studio</h1><p id="loginMessage">Жүктелуде / Загрузка…</p><form id="loginForm"><div class="field"><label for="loginUsername">Логин</label><input id="loginUsername" autocomplete="username" required></div><div class="field"><label for="loginPassword">Құпиясөз / Пароль</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><p id="loginError" role="alert"></p><button class="primary" type="submit">Кіру / Войти</button></form></div></div>
<header><div class="brand"><div class="monogram">S</div><div><strong>SATBAYEV UNIVERSITY</strong><small>ACADEMIC WORKSPACE</small></div></div><div class="top-title"><strong>Syllabus Studio</strong><span id="tagline"></span></div><div class="actions"><button id="accountButton" onclick="profile()">Аккаунт</button><select id="language" class="lang" aria-label="Syllabus language"><option value="kk">ҚАЗ</option><option value="ru">РУС</option><option value="en">ENG</option></select><details id="exportMenu" class="export-menu"><summary id="exportLabel">Экспорт ▾</summary><div class="export-options"><button class="backup" id="backupBtn" onclick="exportJSON()"></button><button id="saveBtn" onclick="saveHTML()"></button></div></details><button id="persistBtn" onclick="saveProjectNow()">Сақтау</button><button id="wordBtn" onclick="exportWord()">Word</button><button class="primary" id="printBtn" onclick="printDoc()"></button></div></header>
<div class="layout"><aside><div class="eyebrow" id="navTitle"></div><div id="nav"></div><div class="sidebar-bottom"><div><span class="dot"></span><span id="status"></span></div><div class="tech"><span>HTML5</span><span>CSS3</span><span>JavaScript</span></div><p id="offlineHint"></p></div></aside><main class="editor" id="editor"></main><section class="preview" aria-label="Document preview"><div class="previewbar"><div><strong id="previewTitle"></strong><br><small id="previewHint"></small></div><button id="viewBtn" class="editor-toggle" onclick="togglePreview()" aria-controls="editor">←</button><span class="pill" id="pageCount">A4</span></div><div class="editbar"><span id="editHint">Мәтінді немесе кестені басып өңдеңіз</span><div><button onclick="setZoom(0.65)" aria-label="65 percent zoom">65%</button><button onclick="setZoom(1)" aria-label="100 percent zoom">100%</button><button onclick="setZoom(0)" id="fitBtn">Сыйғызу</button></div></div><div id="pages"></div></section></div><div id="toast" role="status" aria-live="polite"></div><input type="file" id="importer" accept=".json,application/json" hidden>
<dialog id="picker"><form method="dialog" class="pickerhead"><strong id="pickerTitle"></strong><button aria-label="Close">×</button></form><div class="pickerbody"><input id="pickerSearch" type="search" autocomplete="off" placeholder="Іздеу / Поиск / Search" aria-label="Search options"><div id="pickerCount"></div><div id="pickerOptions" role="listbox" aria-label="Options"></div><div class="pickerfoot"><input id="pickerCustom" placeholder="Өз нұсқаңызды енгізіңіз / Your own value" aria-label="Custom value"><button class="primary" id="pickerApply">Қолдану</button></div></div></dialog>
<dialog id="dateDialog" class="compact-dialog"><form method="dialog" class="pickerhead"><strong id="dateTitle"></strong><button aria-label="Close">×</button></form><div class="calendar-controls"><button id="calendarPrev" aria-label="Previous month">‹</button><select id="calendarMonth" aria-label="Month"></select><select id="calendarYear" aria-label="Year"></select><button id="calendarNext" aria-label="Next month">›</button></div><div id="calendarGrid"></div><div class="calendar-footer"><button id="calendarToday"></button><button id="calendarClear"></button></div></dialog>

<dialog id="profileDialog" class="compact-dialog"><form method="dialog" class="pickerhead"><strong id="profileName"></strong><button aria-label="Close">×</button></form><div class="pickerbody"><form id="passwordForm"><div class="field"><label for="oldPassword">Қазіргі пароль / Текущий пароль</label><input id="oldPassword" type="password" autocomplete="current-password" required></div><div class="field"><label for="newPassword">Жаңа пароль / Новый пароль (10+)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div><button class="primary">Өзгерту / Изменить</button></form><p id="profileMessage" role="alert"></p><button onclick="logout()">Шығу / Выйти</button></div></dialog>
<dialog id="resetPasswordDialog" class="compact-dialog"><form method="dialog" class="pickerhead"><strong>Пароль</strong><button aria-label="Close">×</button></form><div class="pickerbody"><form id="resetPasswordForm"><input id="resetUserId" type="hidden"><div class="field"><label for="resetUserPassword">Жаңа пароль / Новый пароль (10+)</label><input id="resetUserPassword" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></div><button class="primary">Сақтау / Сохранить</button></form></div></dialog>
<dialog id="yearDialog" class="compact-dialog"><form method="dialog" class="pickerhead"><strong id="yearTitle"></strong><button aria-label="Close">×</button></form><div class="pickerbody"><select id="yearValue" style="width:100%;padding:12px" aria-label="Year"></select><button class="primary" id="yearApply">Қолдану / Применить</button></div></dialog>
<button id="aiToggle" class="ai-toggle" type="button">✦ AI</button><button id="selectionAssistant" class="selection-assistant" type="button" hidden aria-label="AI assistant">✦</button>
<section id="aiPanel" class="ai-panel" role="dialog" aria-labelledby="aiTitle" hidden><div class="ai-head"><strong id="aiTitle">AI</strong><button id="aiClose" aria-label="Close">×</button></div><div id="aiStatus" role="status"></div><details class="ai-context"><summary id="aiExcerptLabel"></summary><div id="aiExcerpt">—</div></details><div id="aiPresets"></div><div id="aiMessages" aria-live="polite"></div><p id="aiError" role="alert"></p><form id="aiForm"><textarea id="aiInput" maxlength="6000" required rows="3" aria-label="AI prompt"></textarea><button id="aiSend" class="primary">Send</button></form><p id="aiReview"></p><details class="ai-privacy"><summary id="aiPrivacy"></summary><p id="aiSetupText"></p></details><button id="aiClear" type="button"></button></section>
